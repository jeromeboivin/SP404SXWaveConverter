name: Release

# Push a tag like v0.2.0 to build and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04   # ort's prebuilt libs need glibc >= 2.38
            target: linux
          - os: windows-latest
            target: windows
          # No Intel mac: ort publishes no prebuilt ONNX Runtime for x86_64-apple-darwin.
          - os: macos-latest      # Apple Silicon
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
          cargo install cargo-deb --locked

      # ort's build script copies DirectML.dll into these and panics if missing.
      - name: Windows prebuild dirs
        if: matrix.target == 'windows'
        shell: bash
        run: mkdir -p target/release/build/examples target/release/build/deps

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux .deb)
        if: matrix.target == 'linux'
        run: |
          cargo deb --no-build --deb-version "${{ steps.ver.outputs.version }}" -o "sp404sx-wave-converter_${{ steps.ver.outputs.version }}_amd64.deb"
          echo "ASSET=sp404sx-wave-converter_${{ steps.ver.outputs.version }}_amd64.deb" >> "$GITHUB_ENV"

      - name: Package (Windows zip)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $name = "sp404sx-wave-converter-${{ steps.ver.outputs.version }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/sp404sx-wave-converter.exe $name
          Copy-Item README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package (macOS dmg)
        if: startsWith(matrix.target, 'macos')
        run: |
          name="sp404sx-wave-converter-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir dist
          scripts/make-macos-app.sh target/release/sp404sx-wave-converter "${{ steps.ver.outputs.version }}" dist
          hdiutil create -volname "SP404SX Wave Converter" -srcfolder dist -ov -format UDZO "$name.dmg"
          echo "ASSET=$name.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
