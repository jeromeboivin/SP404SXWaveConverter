[package]
name = "sp404sx-wave-converter"
version = "0.1.0"
edition = "2021"
description = "SP-404SX/A card sample manager"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:tempfile"]

[dependencies]
beat-this = { version = "1.1.0", default-features = false }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
signalsmith-stretch = "0.1.3"
tempfile = { version = "3", optional = true }
ureq = "2"

[dev-dependencies]
tempfile = "3"

# Neural beat tracking (rten) is unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
