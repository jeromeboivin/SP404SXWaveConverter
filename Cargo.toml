[package]
name = "sp404sx-wave-converter"
version = "0.1.0"
edition = "2021"
description = "SP-404SX/A card sample manager"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:cpal"]

[dependencies]
beat-this = { version = "1.1.0", default-features = false }
cpal = { version = "0.18.2", optional = true }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", optional = true }
sha2 = "0.10"
signalsmith-stretch = "0.1.3"
stem-splitter-core = { version = "1.2.0", default-features = false }
tempfile = "3"
ureq = "2"


# Neural beat tracking (rten) is unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[package.metadata.deb]
name = "sp404sx-wave-converter"
maintainer = "Jerome Boivin <boivin.jerome@gmail.com>"
section = "sound"
priority = "optional"
depends = "$auto"
extended-description = "Converts audio files and manages samples for the Roland SP-404SX/A sampler cards."
assets = [
    ["target/release/sp404sx-wave-converter", "usr/bin/", "755"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/sp404sx-wave-converter.png", "644"],
    ["packaging/sp404sx-wave-converter.deb.desktop", "usr/share/applications/sp404sx-wave-converter.desktop", "644"],
]
